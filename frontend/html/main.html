<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trading bots</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
  <main class="page">
    <h1 class="header-title">Торговые боты</h1>

    <section class="layout">
      <div class="left">
        <div class="summary-card">
          <div class="block-label">Общий баланс ботов</div>

          <div class="balance-row">
            <div id="commonBalance" class="balance-value">
              <span class="skeleton sk-balance" aria-label="loading"></span>
            </div>
            <div class="balance-unit">USDT</div>
          </div>

          <div class="pnl-row">
            Общий PNL за сегодня
            <span id="commonPnl" class="pnl-val">
              <span class="skeleton sk-pnl" aria-label="loading"></span>
            </span>
          </div>

          <button class="btn" id="reloadBtn" type="button">Обновить</button>
        </div>

        <div class="panel bots-panel">
          <div class="panel-title">
            Подключенные боты
            <div class="panel-underline"></div>
          </div>

          <div class="bot-row bots-head">
            <div class="bot-name">Название</div>
            <div class="bot-balance">Баланс</div>
            <div class="bot-pnl">PNL</div>
          </div>

          <div id="botsList" class="bots">
            <div class="bot-row">
              <div class="skeleton sk-botname"></div>
              <div class="skeleton sk-botbal"></div>
              <div class="skeleton sk-botpnl"></div>
            </div>
            <div class="bot-row">
              <div class="skeleton sk-botname"></div>
              <div class="skeleton sk-botbal"></div>
              <div class="skeleton sk-botpnl"></div>
            </div>
            <div class="bot-row">
              <div class="skeleton sk-botname"></div>
              <div class="skeleton sk-botbal"></div>
              <div class="skeleton sk-botpnl"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ====== CONFIG ======
    const API_BASE = "http://45.89.188.69:5555";

    const ENDPOINTS = {
      common: "/get_common_balance",
      bots: "/get_bots_list",
      dayStat: "/get_day_stat" // ?bot_id=
    };

    /**
     * @typedef {Object} DayStat
     * @property {number} balance
     * @property {number} pnl
     * @property {number} pnl_percent
     */

    /**
     * @typedef {Object} BotsListResponse
     * @property {Object.<string, string>} bots
     */

    // ====== HELPERS ======
    const fmt2 = (n) => Number(n).toFixed(2);

    function normalizeNearZero(n){
      const v = Number(n);
      return Math.abs(v) < 0.005 ? 0 : v;
    }

    function pnlClass(pnl){
      const v = normalizeNearZero(pnl);
      if (v === 0) return "pnl-zero";
      return v > 0 ? "pnl-pos" : "pnl-neg";
    }

    function pnlText(pnl, pnlPercent){
      const pnlV = normalizeNearZero(pnl);
      const pnlPercentV = normalizeNearZero(pnlPercent);
      const sign = pnlV >= 0 ? "+" : "";
      const signPercent = pnlPercentV >= 0 ? "+" : "";
      return `${sign}$${fmt2(pnlV)} (${signPercent}${fmt2(pnlPercentV)}%)`;
    }

    function splitName(name){
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (parts.length <= 1) return { main: parts[0] || "", sub: "" };
      return { main: parts[0], sub: parts.slice(1).join(" ") };
    }

    /**
     * @param {string} path
     * @returns {Promise<any>}
     */
    async function apiGet(path){
      const url = API_BASE + path;
      const resp = await fetch(url, { method: "GET" });
      if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${url}`);
      return await resp.json();
    }

    // ====== RENDER COMMON ======
    async function loadCommon(){
      const commonBalanceEl = document.getElementById("commonBalance");
      const commonPnlEl = document.getElementById("commonPnl");

      /** @type {DayStat} */
      const data = await apiGet(ENDPOINTS.common);

      commonBalanceEl.textContent = fmt2(data.balance);

      commonPnlEl.className = `pnl-val ${pnlClass(data.pnl)}`;
      commonPnlEl.textContent = pnlText(data.pnl, data.pnl_percent);
    }

    // ====== RENDER BOTS ======
    /**
     * @param {HTMLElement} container
     * @param {string} botId
     * @param {string} botName
     * @returns {{ balanceEl: HTMLElement, pnlEl: HTMLElement }}
     */
    function renderBotRow(container, botId, botName){
      const { main, sub } = splitName(botName);

      const row = document.createElement("div");
      row.className = "bot-row";

      row.innerHTML = `
        <div class="bot-name" title="${botId}">
          <span class="main">${main}</span>
          ${sub ? `<span class="sub">${sub}</span>` : ""}
        </div>
        <div class="bot-balance"><span class="skeleton sk-botbal" aria-label="loading"></span></div>
        <div class="bot-pnl"><span class="skeleton sk-botpnl" aria-label="loading"></span></div>
      `;

      row.style.cursor = "pointer";
      row.addEventListener("click", () => {
        window.location.href = `/bot?bot_id=${encodeURIComponent(botId)}`;
      });

      container.appendChild(row);

      const balanceEl = row.querySelector(".bot-balance");
      const pnlEl = row.querySelector(".bot-pnl");
      if (!(balanceEl instanceof HTMLElement) || !(pnlEl instanceof HTMLElement)){
        throw new Error("Bot row elements not found");
      }

      return { balanceEl, pnlEl };
    }

    /**
     * @param {{ balanceEl: HTMLElement, pnlEl: HTMLElement }} rowRefs
     * @param {DayStat} stat
     */
    function fillBotRowStat(rowRefs, stat){
      const pnlV = normalizeNearZero(stat.pnl);
      const pnlCls = pnlClass(pnlV);
      const sign = pnlV >= 0 ? "+" : "";
      const pnlStr = `${sign}${fmt2(pnlV)} $`;

      rowRefs.balanceEl.textContent = `$${fmt2(stat.balance)}`;
      rowRefs.pnlEl.className = `bot-pnl ${pnlCls}`;
      rowRefs.pnlEl.textContent = pnlStr;
    }

    async function loadBots(){
      const botsEl = document.getElementById("botsList");

      /** @type {BotsListResponse} */
      const botsResp = await apiGet(ENDPOINTS.bots);
      const botsObj = botsResp.bots || {};

      const botIds = Object.keys(botsObj);

      if (botIds.length === 0){
        botsEl.innerHTML = `<div class="muted">Нет подключенных ботов</div>`;
        return;
      }

      botsEl.innerHTML = "";
      const rowRefsByBotId = {};

      for (const botId of botIds){
        rowRefsByBotId[botId] = renderBotRow(botsEl, botId, botsObj[botId]);
      }

      const promises = botIds.map(async (botId) => {
        try{
          /** @type {DayStat} */
          const stat = await apiGet(`${ENDPOINTS.dayStat}?bot_id=${encodeURIComponent(botId)}`);
          fillBotRowStat(rowRefsByBotId[botId], stat);
        }catch(e){
          console.error(e);
          rowRefsByBotId[botId].balanceEl.textContent = "—";
          rowRefsByBotId[botId].pnlEl.className = "bot-pnl pnl-zero";
          rowRefsByBotId[botId].pnlEl.textContent = "—";
        }
      });

      await Promise.allSettled(promises);
    }

    document.getElementById("reloadBtn").addEventListener("click", () => {
      location.reload();
    });

    (async () => {
      try{
        await Promise.all([loadCommon(), loadBots()]);
      }catch(e){
        console.error(e);
      }
    })();
  </script>
</body>
</html>
